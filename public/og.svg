<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="200" fill="rgba(255,255,255,0.08)"/>
  <circle cx="900" cy="100" r="100" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Main emoji -->
  <text x="600" y="260" font-size="120" text-anchor="middle" fill="white">📊</text>
  
  <!-- Title -->
  <text x="600" y="380" font-family="Inter, -apple-system, sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="white">FC Wrapped</text>
  
  <!-- Tagline -->
  <text x="600" y="450" font-family="Inter, -apple-system, sans-serif" font-size="32" text-anchor="middle" fill="rgba(255,255,255,0.9)">Your Farcaster story, beautifully told</text>
  
  <!-- Feature pills -->
  <rect x="230" y="500" width="140" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="300" y="535" font-family="Inter, sans-serif" font-size="24" text-anchor="middle" fill="white">📝 Casts</text>
  
  <rect x="410" y="500" width="140" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="480" y="535" font-family="Inter, sans-serif" font-size="24" text-anchor="middle" fill="white">❤️ Likes</text>
  
  <rect x="590" y="500" width="160" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="670" y="535" font-family="Inter, sans-serif" font-size="24" text-anchor="middle" fill="white">🔄 Recasts</text>
  
  <rect x="790" y="500" width="180" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="880" y="535" font-family="Inter, sans-serif" font-size="24" text-anchor="middle" fill="white">🎭 Your Vibe</text>
</svg>
